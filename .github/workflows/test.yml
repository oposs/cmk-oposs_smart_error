name: Test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Checkmk 2.3 runs Python 3.12
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # tests/conftest.py clones the Checkmk API into .cmk-api/ when it is missing
      - name: Cache Checkmk API
        uses: actions/cache@v4
        with:
          path: .cmk-api
          key: cmk-api-${{ hashFiles('tests/conftest.py') }}

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
