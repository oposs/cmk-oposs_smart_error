name: Proof of ri-release-mkp (temporary)
# Runs the release build once on this branch to prove ri-release-mkp in a
# consumer before repo-infra merges it. Removed again before the merge.
on:
  push:
    branches: [repo-infra/apply]
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/release-build.yml
    with:
      version: 1.2.1
      ref: ${{ github.sha }}
